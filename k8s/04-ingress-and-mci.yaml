# Standard GKE External Application Load Balancer Ingress (Free-Tier Compatible)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meridian-global-ingress
  namespace: meridian-prod
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "meridian-global-lb-ip"
spec:
  rules:
    - http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront-ui
                port:
                  number: 80
---
# Optional Multi-Cluster Ingress (MCI) Manifest when Fleet MCI is enabled
# Note: Skip applying MultiClusterIngress if using GCP Free Trial without Fleet API
apiVersion: networking.gke.io/v1
kind: MultiClusterIngress
metadata:
  name: meridian-mci-global
  namespace: meridian-prod
  annotations:
    networking.gke.io/static-ip: "meridian-global-lb-ip"
spec:
  template:
    spec:
      backend:
        serviceName: storefront-ui-mcs
        servicePort: 80
      rules:
        - host: www.meridiansupply.example.com
          http:
            paths:
              - path: /api/orders
                backend:
                  serviceName: order-service-mcs
                  servicePort: 8081
              - path: /
                backend:
                  serviceName: storefront-ui-mcs
                  servicePort: 80
