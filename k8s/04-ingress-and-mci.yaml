# Public web entry: GKE external Application Load Balancer with HTTPS
# and Cloud Armor attached to the storefront NEG via BackendConfig.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meridian-public-ingress
  namespace: meridian-prod
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "meridian-global-lb-ip"
spec:
  tls:
    - hosts:
        - www.meridiansupply.com
      secretName: meridian-public-tls
  rules:
    - host: www.meridiansupply.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront-ui
                port:
                  number: 80
