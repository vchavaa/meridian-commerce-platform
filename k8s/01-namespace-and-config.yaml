apiVersion: v1
kind: Namespace
metadata:
  name: meridian-prod
  labels:
    app.kubernetes.io/part-of: meridian-commerce
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-secret-sync-ksa
  namespace: meridian-prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-app-ksa
  namespace: meridian-prod
  annotations:
    iam.gke.io/gcp-service-account: meridian-app-workload-sa@cs-512516.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: meridian-platform-config
  namespace: meridian-prod
data:
  SITE_TITLE: "Meridian Supply Co."
  ORDER_API_URL: "http://order-service.meridian-prod.svc.cluster.local:8081"
  APP_ENV: "production"
  DRAIN_REGION: "false"
  RELEASE_TRACK: "stable"
  DB_HOST: "127.0.0.1"
  DB_PORT: "5432"
  DB_NAME: "meridian"
  DB_USER: "meridian-app-workload-sa@cs-512516.iam"
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: "cs-512516:us-central1:meridian-orders-db"
  PUBSUB_TOPIC: "projects/cs-512516/topics/meridian-order-events"
  GOOGLE_OIDC_AUDIENCE: "https://www.meridiansupply.com"
  ADMIN_ALLOWED_EMAILS: "replace-with-operator-email@example.com"
