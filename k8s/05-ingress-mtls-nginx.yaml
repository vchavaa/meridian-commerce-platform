# Public partner endpoint: install the ingress-nginx controller in a dedicated
# ingress-nginx namespace before applying this resource. The controller Service
# receives its own public LoadBalancer address; publish partners.* to that address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meridian-partner-api-mtls
  namespace: meridian-prod
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "meridian-prod/ingress-ca-secret"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - partners.meridiansupply.com
      secretName: meridian-partner-tls
  rules:
    - host: partners.meridiansupply.com
      http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8081
