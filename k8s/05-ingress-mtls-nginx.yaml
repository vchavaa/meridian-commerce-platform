# ============================================================================
# Enhancement 2: Option B — In-Cluster NGINX Ingress mTLS (Zero-GCP-Cost)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ingress-ca-secret
  namespace: meridian-prod
type: Opaque
data:
  ca.crt: 
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meridian-nginx-mtls-ingress
  namespace: meridian-prod
  annotations:
    # 1. Enforce strict mTLS client certificate verification at the Ingress layer
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    # 2. Reference the Root CA Secret stored in meridian-prod namespace
    nginx.ingress.kubernetes.io/auth-tls-secret: "meridian-prod/ingress-ca-secret"
    # 3. Maximum validation chain depth
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    # 4. Forward validated client subject DN (Ssl-Client-Subject-Dn) to backend pods
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    # 5. Preserve Akamai True-Client-IP & X-Cloud-Trace-Context headers
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: www.meridiansupply.com
      http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront-ui
                port:
                  number: 80
