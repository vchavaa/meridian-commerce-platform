apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: meridian-ingress-certificates
  namespace: meridian-prod
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/cs-512516/secrets/meridian-public-tls-cert/versions/latest"
        path: "public.crt"
      - resourceName: "projects/cs-512516/secrets/meridian-public-tls-key/versions/latest"
        path: "public.key"
      - resourceName: "projects/cs-512516/secrets/meridian-partner-tls-cert/versions/latest"
        path: "partner.crt"
      - resourceName: "projects/cs-512516/secrets/meridian-partner-tls-key/versions/latest"
        path: "partner.key"
      - resourceName: "projects/cs-512516/secrets/meridian-partner-client-ca/versions/latest"
        path: "partner-ca.crt"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: meridian-public-tls
  namespace: meridian-prod
spec:
  serviceAccountName: meridian-secret-sync-ksa
  secretProviderClassName: meridian-ingress-certificates
  secretObject:
    type: kubernetes.io/tls
    data:
      - sourcePath: public.crt
        targetKey: tls.crt
      - sourcePath: public.key
        targetKey: tls.key
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: meridian-partner-tls
  namespace: meridian-prod
spec:
  serviceAccountName: meridian-secret-sync-ksa
  secretProviderClassName: meridian-ingress-certificates
  secretObject:
    type: kubernetes.io/tls
    data:
      - sourcePath: partner.crt
        targetKey: tls.crt
      - sourcePath: partner.key
        targetKey: tls.key
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: ingress-ca-secret
  namespace: meridian-prod
spec:
  serviceAccountName: meridian-secret-sync-ksa
  secretProviderClassName: meridian-ingress-certificates
  secretObject:
    type: Opaque
    data:
      - sourcePath: partner-ca.crt
        targetKey: ca.crt
