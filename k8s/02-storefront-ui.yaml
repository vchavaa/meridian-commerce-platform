apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-ui
  namespace: meridian-prod
  labels:
    app: storefront-ui
    tier: frontend
    track: stable
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: storefront-ui
      track: stable
  template:
    metadata:
      labels:
        app: storefront-ui
        tier: frontend
        track: stable
    spec:
      serviceAccountName: meridian-app-ksa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: storefront-ui
              track: stable
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: storefront-ui
              track: stable
      containers:
        - name: storefront-ui
          image: us-central1-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/meridian-containers/storefront-ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: meridian-platform-config
          env:
            - name: SERVICE_NAME
              value: "storefront-ui"
            - name: GOOGLE_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: meridian-platform-config
                  key: GOOGLE_OIDC_AUDIENCE
            - name: ADMIN_ALLOWED_EMAILS
              valueFrom:
                configMapKeyRef:
                  name: meridian-platform-config
                  key: ADMIN_ALLOWED_EMAILS
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "--address=127.0.0.1"
            - "--port=5432"
            - "$(CLOUD_SQL_INSTANCE_CONNECTION_NAME)"
          env:
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: meridian-platform-config
                  key: CLOUD_SQL_INSTANCE_CONNECTION_NAME
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-ui
  namespace: meridian-prod
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "meridian-akamai-origin-config"}'
spec:
  type: ClusterIP
  selector:
    app: storefront-ui
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront-ui-hpa
  namespace: meridian-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront-ui
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront-ui-pdb
  namespace: meridian-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: storefront-ui
      track: stable
